<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background:
      radial-gradient(900px 520px at 100% 100%, rgba(249, 115, 22, 0.16), transparent 60%),
      radial-gradient(700px 420px at 0% 0%, rgba(248, 113, 113, 0.08), transparent 60%),
      #101010;
    color: #e5e7eb;
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(#ffffff08 1px, transparent 1px), linear-gradient(90deg, #ffffff08 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(circle at 30% 40%, #000 0%, transparent 75%);
  }
  .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 34px; }
  .brand img { width: 44px; height: 44px; border-radius: 8px; }
  .brand span { font-family: "JetBrains Mono", monospace; font-size: 15px; color: #9ca3af; letter-spacing: 0.04em; }
  h1 { font-size: 64px; line-height: 1.04; font-weight: 800; letter-spacing: -0.03em; color: #f3f4f6; }
  h1 em {
    font-style: normal;
    background: linear-gradient(90deg, #fdba74, #f87171);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { margin-top: 26px; font-size: 24px; line-height: 1.4; color: #b4b8c0; font-weight: 500; }
  .tags { margin-top: 34px; display: flex; gap: 10px; flex-wrap: wrap; }
  .tags span { font-size: 14px; color: #d1d5db; border: 1px solid #2a2a2a; background: #161616; border-radius: 999px; padding: 7px 14px; }
  .frame {
    position: absolute; left: 590px; top: 70px; width: 760px; height: 600px;
    border-radius: 14px; overflow: hidden;
    border: 1px solid #2c2c2c; background: #151515;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(249, 115, 22, 0.08);
  }
  .bar { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #1b1b1b; border-bottom: 1px solid #262626; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: #3a3a3a; display: block; }
  .bar i:nth-child(1) { background: #f87171; } .bar i:nth-child(2) { background: #fbbf24; } .bar i:nth-child(3) { background: #4ade80; }
  .shot { width: 100%; display: block; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="text">
    <div class="brand"><img src="{{LOGO}}" alt="" /><span>open source · MIT</span></div>
    <h1>S3 Storage <em>Manager</em></h1>
    <p>Web file manager for Amazon S3 and S3-compatible storage</p>
    <div class="tags"><span>Upload</span><span>Preview &amp; edit</span><span>Share links</span><span>Runs in your browser</span></div>
  </div>
  <div class="frame">
    <div class="bar"><i></i><i></i><i></i></div>
    <img class="shot" src="{{SCREENSHOT}}" alt="" />
  </div>
</body>
</html>
