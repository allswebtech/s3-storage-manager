<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <!-- Original illustration for the demo bucket of the README screenshots (dusk over a mountain lake). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1446"/>
      <stop offset="0.38" stop-color="#5b2a6e"/>
      <stop offset="0.62" stop-color="#c2546a"/>
      <stop offset="0.8" stop-color="#f39256"/>
      <stop offset="1" stop-color="#fcc77a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="0.55" stop-color="#ffd58a"/>
      <stop offset="1" stop-color="#ffb46b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf8a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0a067"/>
      <stop offset="0.25" stop-color="#9c4a6c"/>
      <stop offset="1" stop-color="#1a1238"/>
    </linearGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b65a74"/>
      <stop offset="1" stop-color="#8a4170"/>
    </linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e3268"/>
      <stop offset="1" stop-color="#4a2257"/>
    </linearGradient>
    <linearGradient id="m3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1a4c"/>
      <stop offset="1" stop-color="#24113a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff" opacity="0.8">
    <circle cx="140" cy="90" r="1.6"/><circle cx="310" cy="160" r="1.2"/><circle cx="470" cy="70" r="1.8"/>
    <circle cx="620" cy="140" r="1.1"/><circle cx="780" cy="60" r="1.4"/><circle cx="930" cy="120" r="1.2"/>
    <circle cx="1090" cy="80" r="1.7"/><circle cx="1240" cy="150" r="1.1"/><circle cx="1390" cy="70" r="1.5"/>
    <circle cx="1520" cy="130" r="1.2"/><circle cx="230" cy="230" r="1"/><circle cx="1330" cy="240" r="1"/>
    <circle cx="70" cy="200" r="1.1"/><circle cx="1010" cy="210" r="0.9"/><circle cx="560" cy="250" r="0.9"/>
  </g>

  <!-- sun -->
  <circle cx="1040" cy="560" r="300" fill="url(#glow)"/>
  <circle cx="1040" cy="560" r="110" fill="url(#sun)"/>
  <circle cx="1040" cy="560" r="62" fill="#fff1cf"/>

  <!-- clouds -->
  <g fill="#ffd9b0" opacity="0.35">
    <rect x="200" y="380" width="420" height="10" rx="5"/>
    <rect x="280" y="404" width="300" height="8" rx="4"/>
    <rect x="1180" y="330" width="360" height="9" rx="4.5"/>
    <rect x="1240" y="352" width="220" height="7" rx="3.5"/>
  </g>

  <!-- far range -->
  <path fill="url(#m1)" d="M0 600 L120 520 L210 560 L330 450 L440 540 L560 470 L680 560 L800 500 L900 560 L1010 480 L1130 560 L1250 470 L1370 540 L1480 490 L1600 560 L1600 640 L0 640 Z"/>
  <!-- middle range -->
  <path fill="url(#m2)" d="M0 640 L90 590 L180 620 L300 520 L380 580 L470 540 L600 630 L720 560 L820 610 L940 540 L1060 640 L1180 580 L1290 620 L1400 540 L1500 600 L1600 570 L1600 680 L0 680 Z"/>
  <!-- snow caps -->
  <g fill="#f6d9e4" opacity="0.55">
    <path d="M300 520 L330 548 L312 543 L296 556 L282 540 Z"/>
    <path d="M940 540 L968 564 L950 560 L934 570 L922 557 Z"/>
    <path d="M1400 540 L1426 562 L1410 558 L1396 568 L1384 556 Z"/>
  </g>
  <!-- near hills -->
  <path fill="url(#m3)" d="M0 690 Q200 620 400 680 T800 670 T1200 690 T1600 660 L1600 720 L0 720 Z"/>

  <!-- lake -->
  <rect y="700" width="1600" height="300" fill="url(#water)"/>
  <g fill="#fff1cf" opacity="0.7">
    <rect x="985" y="720" width="110" height="5" rx="2.5"/>
    <rect x="1005" y="744" width="70" height="4" rx="2"/>
    <rect x="960" y="770" width="160" height="4" rx="2" opacity="0.6"/>
    <rect x="1015" y="798" width="50" height="3" rx="1.5"/>
    <rect x="990" y="830" width="100" height="3" rx="1.5" opacity="0.5"/>
  </g>
  <g fill="#ffd2b0" opacity="0.18">
    <rect x="160" y="760" width="260" height="3" rx="1.5"/>
    <rect x="520" y="820" width="320" height="3" rx="1.5"/>
    <rect x="1240" y="790" width="240" height="3" rx="1.5"/>
    <rect x="300" y="900" width="420" height="3" rx="1.5"/>
  </g>

  <!-- pine silhouettes on the shore -->
  <g fill="#150b28">
    <path d="M0 1000 L0 700 L40 690 L70 720 L110 700 L150 730 L190 715 L230 740 L260 1000 Z"/>
    <path d="M60 720 L80 640 L100 720 Z"/><path d="M120 735 L145 630 L170 735 Z"/><path d="M180 735 L198 670 L216 735 Z"/>
    <path d="M1600 1000 L1600 700 L1560 695 L1520 720 L1480 710 L1440 735 L1400 1000 Z"/>
    <path d="M1490 720 L1510 650 L1530 720 Z"/><path d="M1540 710 L1565 610 L1590 710 Z"/><path d="M1440 735 L1458 680 L1476 735 Z"/>
  </g>
</svg>
